plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.odininputmirror"
    compileSdk 35

    defaultConfig {
        applicationId "com.odininputmirror"
        minSdk 28
        targetSdk 35
        versionCode 4
        versionName "0.2.0"
        buildConfigField "boolean", "FORCE_DOCK_MODE_FOR_DEV", "false"
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    testOptions {
        // The classes under test here are the supervisor's shared state and the editor's state
        // machine, both plain Kotlin. Stubbing the framework calls they never make keeps them
        // testable on the JVM without pulling in Robolectric. Same setting as :data.
        unitTests.returnDefaultValues = true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "FORCE_DOCK_MODE_FOR_DEV", "false"
        }

        release {
            // No debug-key fallback: without keystore.properties the release APK is left UNSIGNED
            // (uninstallable) instead of silently shipping signed with whatever debug keystore this
            // machine happens to have — which would break update continuity for users.
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation project(":domain")
    implementation project(":data")

    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.activity.compose

    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    debugImplementation libs.androidx.ui.tooling

    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test
}
