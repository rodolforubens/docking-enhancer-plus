plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.odininputmirror.data"
    compileSdk 35

    defaultConfig {
        minSdk 23
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation project(":domain")
    testImplementation "junit:junit:4.13.2"
}
